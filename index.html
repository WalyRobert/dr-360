<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR360° - Dodge Recian - Cinema Imersivo 360°</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            position: relative;
        }

        /* Efeito de cortina de cinema */
        .curtain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(139, 0, 0, 0.5) 0%, transparent 15%, transparent 85%, rgba(139, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Fundo estilo cinema */
        .cinema-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            z-index: 0;
        }

        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 800px;
        }

        /* Logo estilo cinema */
        .logo {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
            letter-spacing: -3px;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.8));
            }
        }

        .title {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 10px;
            letter-spacing: 3px;
            color: #fff;
        }

        .subtitle {
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 50px;
            color: #FFD700;
            text-transform: uppercase;
        }

        .description {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 60px;
            line-height: 1.8;
            font-style: italic;
        }

        /* Botão estilo cinema */
        .btn-cinema {
            display: inline-block;
            padding: 20px 60px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            border: 3px solid #FFD700;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), inset 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .btn-cinema::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: left 0.3s ease;
        }

        .btn-cinema:hover::before {
            left: 100%;
        }

        .btn-cinema:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6), inset 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .btn-cinema:active {
            transform: scale(0.98);
        }

        /* Efeito de iluminação */
        .lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .light {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
        }

        .light1 {
            top: 10%;
            left: 10%;
            width: 300px;
            height: 300px;
            animation: float 8s ease-in-out infinite;
        }

        .light2 {
            bottom: 10%;
            right: 10%;
            width: 250px;
            height: 250px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { opacity: 0.5; transform: translate(0, 0); }
            50% { opacity: 0.8; transform: translate(20px, 20px); }
        }

        /* Linha horizontal estilo cinema */
        .cinema-line {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            margin: 30px auto;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .footer {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="cinema-bg"></div>
    <div class="lights">
        <div class="light light1"></div>
        <div class="light light2"></div>
    </div>
    <div class="curtain"></div>

    <div class="container">
        <div class="logo">DR360°</div>
        <div class="title">DODGE RECIAN</div>
        <div class="cinema-line"></div>
        <div class="subtitle">CINEMA IMERSIVO 360°</div>
        <p class="description">
            Experimente a época de ouro do cinema em realção total.<br>
            Uma jornada visual extraordinária que desafia os limites da realidade.
        </p>
        <button class="btn-cinema" onclick="window.location.href='https://dr-360.vercel.app/'">ENTRAR NO CINEMA</button>
        <div class="cinema-line"></div>
    </div>

    <div class="footer">Premium 360° Immersive Experience</div>

    <script>
        // Auto-redirect após 5 segundos
        setTimeout(() => {
            window.location.href = 'https://dr-360.vercel.app/';
        }, 5000);
    </script>
</body>
</html>
