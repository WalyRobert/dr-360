<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DR360° - Dodge Recian</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .container {
      text-align: center;
      max-width: 600px;
      width: 90%;
    }
    .logo {
      font-size: 72px;
      margin-bottom: 30px;
      color: #d4af37;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #d4af37;
      margin: 0 0 20px 0;
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 4px;
    }
    p {
      color: #a0a0a0;
      font-size: 18px;
      margin: 0 0 40px 0;
      line-height: 1.6;
    }
    .button-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      min-width: 160px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #d4af37 0%, #e5c158 100%);
      color: #1a1a1a;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
    }
    .btn-secondary {
      background: transparent;
      color: #d4af37;
      border: 2px solid #d4af37;
    }
    .btn-secondary:hover {
      background: #d4af37;
      color: #1a1a1a;
      transform: translateY(-2px);
    }
    .features {
      margin-top: 60px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 30px;
    }
    .feature {
      color: #a0a0a0;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">DR 360°</div>
    <h1>Dodge Recian</h1>
    <p>Luxury Immersive Vision</p>
    <p>Experience 360° viewing with advanced tracking and VR support</p>
    
    <div class="button-container">
      <button class="btn btn-primary" onclick="goToApp()">START</button>
    </div>
    
    <div class="features">
      <div class="feature">
        <strong>360°</strong><br>Full View
      </div>
      <div class="feature">
        <strong>HD</strong><br>High Quality
      </div>
      <div class="feature">
        <strong>VR</strong><br>Compatible
      </div>
    </div>
  </div>

  <script>
    function goToApp() {
      window.location.href = 'https://ai.studio/apps/drive/1YJu-PnuwAaHhj7NSugpM2wL8IBnql5tc?fullscreenApplet=true';
    }
  </script>
</body>
</html>
