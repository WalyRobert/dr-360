<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DR 360° - Player de vídeo 360 graus</title>
  </head>
      <script>
      // Remove Vercel Toolbar
      const style = document.createElement('style');
      style.innerHTML = `
        [data-testid="vercel-toolbar"],
        .vercel-toolbar,
        [class*="vercel"][class*="toolbar"],
        iframe[src*="vercel"] { display: none !important; }
      `;
      document.head.appendChild(style);
      
      // Remove Vercel toolbar elements by observer
      const observer = new MutationObserver(() => {
        document.querySelectorAll('[data-testid="vercel-toolbar"], .vercel-toolbar, [class*="vercel"][class*="toolbar"]').forEach(el => {
          el.style.display = 'none';
          el.remove();
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
